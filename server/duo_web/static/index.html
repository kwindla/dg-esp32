<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Duo Web Device</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --ink:#e8e9ec; --dim:#8b909a; --line:#2c3038;
          --accent:#7cc4ff; --ok:#6fd08c; --warn:#f2b45a; --bad:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns:minmax(0,440px) minmax(0,1fr); }
  @media (max-width:820px){ main { grid-template-columns:minmax(0,1fr); } }
  h1 { font-size:15px; font-weight:600; margin:0 0 10px; letter-spacing:.02em; }
  .device { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .bezel { width:min(100%,412px); aspect-ratio:1; border-radius:50%; padding:10px;
           background:radial-gradient(circle at 35% 30%,#3a3e46,#0b0c0e 70%); box-shadow:0 10px 40px #000a; }
  canvas { width:100%; height:100%; border-radius:50%; display:block; touch-action:manipulation;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; background:#000; }
  .hint { color:var(--dim); font-size:12px; text-align:center; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#25476a; border-color:#3b6c9c; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .side { display:flex; flex-direction:column; gap:16px; min-width:0; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:0; }
  dt { color:var(--dim); } dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .s-ready { color:var(--ok); border-color:var(--ok); } .s-busy { color:var(--warn); border-color:var(--warn); }
  .s-off { color:var(--dim); } .s-bad { color:var(--bad); border-color:var(--bad); }
  .meter { height:6px; background:#0d0f12; border-radius:3px; overflow:hidden; }
  .meter > i { display:block; height:100%; width:0; background:var(--accent); transition:width 60ms linear; }
  #log { height:340px; overflow-y:auto; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
         white-space:pre-wrap; overflow-wrap:anywhere; }
  #log .user { color:#9fd3ff; } #log .bot { color:#ffd88a; } #log .duo { color:#b6a6ff; }
  #log .err { color:var(--bad); } #log .sys { color:var(--dim); }
  label.chk { color:var(--dim); font-size:12px; display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<main>
  <section class="device">
    <div class="bezel"><canvas id="face" width="412" height="412" aria-label="Device screen: double-tap to switch character"></canvas></div>
    <div class="hint">Double-tap the screen (or press <b>Space</b> twice) to switch, like the S3.</div>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
      <button id="tap">Double-tap</button>
      <button id="mute">Mute mic</button>
    </div>
  </section>
  <section class="side">
    <div class="panel">
      <h1>Device</h1>
      <dl>
        <dt>Connection</dt><dd><span id="state" class="pill s-off">disconnected</span></dd>
        <dt>Character</dt><dd id="character">angel</dd>
        <dt>Switch</dt><dd id="pending">idle</dd>
        <dt>Rev / conn</dt><dd id="rev">–</dd>
        <dt>Liveness</dt><dd id="live">–</dd>
        <dt>Counters</dt><dd id="counts">–</dd>
        <dt>Mic</dt><dd><div class="meter"><i id="mic"></i></div></dd>
        <dt>Bot</dt><dd><div class="meter"><i id="spk"></i></div></dd>
      </dl>
    </div>
    <div class="panel">
      <h1 style="display:flex;justify-content:space-between;align-items:center">Log
        <label class="chk"><input type="checkbox" id="verbose"> wire messages</label></h1>
      <div id="log"></div>
    </div>
  </section>
</main>
<script type="module" src="static/app.js"></script>
</body>
</html>
