[project]
name = "dg-pipecat-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pipecat-ai[webrtc,deepgram,openai,silero,runner,typesafe]==1.16.0",
  "python-dotenv>=1", "numpy>=2", "scipy>=1.14", "httpx>=0.28",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
